# =============================================================================
# appliance-secrets.example.conf  -  EXAMPLE ONLY (contains NO real secrets)
# =============================================================================
# Passed to Deploy-VeeamProxies.ps1 via -ApplianceSecretsFile. Holds the SHARED appliance
# account settings rendered into every node's /etc/veeam/vbr_init.cfg answer file
# (Veeam Infrastructure Appliance 13.1, "Automating Installation with Initial Configuration").
#
#   * Copy to a protected file (owner-only ACL). NEVER commit the real file, NEVER put these
#     values in the CSV. The script never logs them.
#   * Scope one secrets file PER VBR (not fleet-wide) to bound the blast radius of a leak.
#   * Distinct from -VBRMfaSecret / -VBRMfaSecretFile (the VBR REST service account's TOTP seed
#     used by Stage B - a different machine and account).
#
# The script validates every value BEFORE building an ISO (Test-ApplianceSecrets). Rules from
# the Veeam docs (build 13.1.1.18):
#   passwords : >= 15 chars; >= 1 upper, 1 lower, 1 digit, 1 special; no more than 4
#               characters of the same class in a row; veeamadmin and veeamso must differ.
#   MFA seed  : 16-character Base32 string (A-Z, 2-7). Required for every account whose MFA is
#               enabled. (13.1 makes MFA optional at deployment; this project keeps it ON for
#               veeamadmin with one shared seed.)
#   recovery  : hex GUID, e.g. from New-Guid. Required only when the Security Officer is
#               enabled. Record it - it is the SO break-glass token.
#   ntp       : one or more servers separated by ';' (NTS servers are not accepted here).
#
# Format: KEY = VALUE, one per line. '#' comments and blank lines ignored.
# -----------------------------------------------------------------------------

# --- Host Administrator (veeamadmin) -----------------------------------------
VEEAMADMIN_PASSWORD      = Ex@mp13-Adm1n-Pa55w0rd!
# Project decision (2026-09-24): TOTP ON for veeamadmin, with ONE shared seed across all proxies.
# The same seed goes into every node's answer file, so one authenticator entry opens every proxy
# console / Host Management Console. Guard this file accordingly (owner-only, out of the CSV).
VEEAMADMIN_MFA_ENABLED   = true
# 16-character Base32 (A-Z, 2-7). Generate a fresh one for production; this value is an example.
VEEAMADMIN_MFA_SECRET    = JBSWY3DPEHPK3PXP

# --- Security Officer (veeamso) ----------------------------------------------
# Project decision (2026-09-24): DISABLED on proxies (no four-eyes account). With
# VEEAMSO_ENABLED = false the three keys below may stay empty - the script fills the answer
# file's veeamso.* lines with random, rule-compliant placeholders that are never used.
# Set VEEAMSO_ENABLED = true to get a Security Officer; then password, MFA seed and recovery
# token become required (the SO's MFA is always on).
VEEAMSO_ENABLED          = false
VEEAMSO_PASSWORD         =
VEEAMSO_MFA_ENABLED      = true
VEEAMSO_MFA_SECRET       =
# Break-glass recovery token (hex GUID from New-Guid). Required only when the SO is enabled.
VEEAMSO_RECOVERY_TOKEN   =

# --- Time -----------------------------------------------------------------------
NTP_SERVERS              = ntp01.example.local;ntp02.example.local
NTP_RUNSYNC              = true

# --- Control flags (defaults; normally leave as is) ----------------------------
VBR_RUNINITISO           = true
VBR_RUNSTART             = true
# Remove the plaintext /etc/veeam/vbr_init.cfg from the appliance after a successful apply.
CLEANUP_ANSWER_FILE      = true
